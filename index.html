<style>

:root{--bg:#FAF8F5;--card:#fff;--mist:#F1EAEE;--aub:#5B2743;--aub2:#7a3a5c;--ink:#191919;--mute:#6f6168;--line:#e6dde2;--red:#DA0821;--ok:#3f7d5a;--okbg:#e3f0e8;--mid:#b07d2b;--midbg:#f6ecd6;--badbg:#f1e4e7;--S:#d98b3a;--G:#e0b72e;--P:#4b8f5f;--shadow:0 1px 2px rgba(91,39,67,.06),0 8px 24px rgba(91,39,67,.07);--hero:linear-gradient(135deg,#4a1d36 0%,#5B2743 55%,#7a3a5c 100%)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Manrope,system-ui,sans-serif;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

h3{font:600 14px Manrope;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 14px;max-width:62ch}
.hero{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 26px;background:var(--hero);color:#F1EAEE;position:relative;overflow:hidden}

.hero>*{max-width:820px;margin-left:auto;margin-right:auto;position:relative;z-index:1}

.kpi b{display:block;font:300 34px/1 Outfit}
.kpi span{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#d8c3cf;margin-top:7px}
.kpi small{display:block;font-size:12px;margin-top:4px;color:#f3c7d6}
.up{color:#9be0b4!important}

nav::-webkit-scrollbar{display:none}

nav button.on{background:var(--aub);color:var(--bg);border-color:var(--aub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;box-shadow:var(--shadow);margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font:300 38px/1 Outfit;color:var(--aub)}
.l{font-size:11px;color:var(--mute);margin-top:7px;text-transform:uppercase;letter-spacing:.09em}
.insight{display:flex;gap:14px;align-items:flex-start}
.insight .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--mist);color:var(--aub);display:grid;place-items:center;font:400 18px Outfit}
.insight p{margin:2px 0 0;color:var(--mute);font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11px Manrope;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}

.pill{display:inline-block;font:600 11px Manrope;padding:3px 10px;border-radius:999px;flex:none}
.pa{background:var(--okbg);color:var(--ok)}.ps{background:var(--midbg);color:var(--mid)}.pi{background:var(--badbg);color:var(--red)}

.rS{background:var(--S)}.rG{background:var(--G)}.rP{background:var(--P)}
.note{font-size:12.5px;color:var(--mute);margin:10px 0 0}

.seg button.on{background:var(--aub);color:var(--bg)}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
svg text{font:11px Manrope;fill:var(--mute)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:3}
.tip b{font:600 13px Manrope}
.strip{display:flex;gap:2px;margin-top:10px}
.strip i{flex:1;height:30px;border-radius:4px;background:var(--line)}
.strip-l{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:5px}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:10px;align-items:center}
.leg .r{width:14px;height:14px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.person{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.person:last-child{border:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:400 16px Outfit;color:#fff}
.av.a{background:var(--ok)}.av.s{background:var(--mid)}.av.i{background:#a9919d}
.person .m{flex:1;min-width:0}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.lc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.lc .card{margin-top:0}
.lc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--aub);color:var(--bg);display:grid;place-items:center;font:600 13px Manrope}
.step p{margin:2px 0 0;color:var(--mute);font-size:14px}
.msg{background:var(--mist);border-radius:14px;padding:14px;font-size:14px;margin-top:10px}
.btn{font:600 13px Manrope;border:0;border-radius:999px;background:var(--aub);color:var(--bg);padding:9px 16px;cursor:pointer;margin-top:10px}
#lock{max-width:380px;margin:18vh auto 0;text-align:center}
#lock .brand,#lock h1{color:var(--aub)}
#lock input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:400 16px Manrope;margin:16px 0 10px;background:var(--card);color:var(--ink)}
#lock button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--aub);color:var(--bg);font:600 15px Manrope;cursor:pointer}
#err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}

.sec{display:none}.sec.on{display:block;animation:in .35s ease}

.person .m span em{font-style:normal;font-weight:600}.up{color:var(--ok)}.dn{color:var(--red)}.nw{color:var(--aub2)}
.mxr{display:flex;align-items:center;margin:3px 0;min-width:max-content}
.mxn{position:sticky;left:0;z-index:1;background:var(--card);width:132px;flex:none;font-size:12.5px;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mxh .mxc u{height:14px;background:none;position:relative}.mxh .mxc u[data-y]::after{content:attr(data-y);position:absolute;left:0;top:0;font-size:10px;color:var(--mute)}
.rwb{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}.rwb:last-child{border:0}
.rwd{flex:none;width:70px;font:600 12.5px Manrope;color:var(--aub)}
.rwl{display:grid;gap:5px;font-size:13.5px;min-width:0}.rwl .r{width:18px;height:18px;font-size:10px;margin-right:6px;vertical-align:-4px}
.gl{display:grid;gap:10px}
.cd{display:flex;gap:14px;align-items:center}
.cd .big{font-size:56px}
.sl{padding:14px 0;border-bottom:1px solid var(--line)}
.sl:last-child{border:0}
.sl .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sl .hd b{font:400 17px/1.2 Outfit;color:var(--aub)}
.sl .tg{font-size:12.5px;color:var(--mute)}
.sl .nm{font-size:14px;margin:4px 0 8px}
.pb{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;background:var(--aub)}
.pb.ok i{background:var(--ok)}.pb.mid i{background:var(--mid)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font:600 11.5px Manrope;padding:3px 9px;border-radius:999px;background:var(--badbg);color:var(--mute)}
.chip.y{background:var(--okbg);color:var(--ok)}
.chip.n{background:var(--mist);color:var(--mute)}
.pp.ok{background:var(--okbg);color:var(--ok)}.pp.mid{background:var(--midbg);color:var(--mid)}.pp.bad{background:var(--badbg);color:var(--red)}
.gcard{cursor:pointer}

const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.s),iterations:BLOB.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
 const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.i)},key,b64(BLOB.c));return JSON.parse(new TextDecoder().decode(p))}
$("#f").onsubmit=async e=>{e.preventDefault();const pw=$("#pw").value.trim();$("#err").textContent="";
 try{const D=await dec(pw);try{if($("#rem").checked)localStorage.setItem("na-pw",pw)}catch(_){}show(D)}catch(_){$("#err").textContent="Dat wachtwoord klopt niet."}};
(async()=>{try{const pw=localStorage.getItem("na-pw");if(pw){show(await dec(pw))}}catch(_){try{localStorage.removeItem("na-pw")}catch(__){}}})();

const MN=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MF=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const fd=s=>{if(!s)return"–";const[y,m,d]=s.split("-");return d?`${+d} ${MN[+m-1]} ${y}`:`${MN[+m-1]} ${y}`};
const fn=n=>Math.round(n).toLocaleString("nl-BE");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RN={S:"Silver",G:"Gold",P:"Platinum"};
const RC={S:"#d98b3a",G:"#e0b72e",P:"#4b8f5f"};
const KEEP=new Set(["DYOB","BVBA","BV","CBC","VOF","TEN2"]);
const LOW=new Set(["van","de","der","den","ten","te","von","du"]);
function nice(n){let p=n.split(", ");if(p.length>1)p=[p.slice(1).join(" "),p[0]];const s=p.join(" ");
 return s.split(" ").map((w,i)=>KEEP.has(w.toUpperCase())?w.toUpperCase():(i&&LOW.has(w.toLowerCase())?w.toLowerCase():w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())).join(" ")}
const nd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function ago(d){if(d<1)return"vandaag";if(d<14)return d+" dagen geleden";if(d<75)return Math.round(d/7)+" weken geleden";if(d<700)return Math.round(d/30.4)+" mnd geleden";return(d/365).toFixed(1).replace(".",",")+" jaar geleden"}
function status(x,asof){if(!x.last)return["i","Nog niet besteld",9999];const d=nd(x.last,asof);return d<=62?["a","Actief",d]:d<=200?["s","Rustig",d]:["i","Inactief",d]}
const rk=r=>r==="G"||r==="S"||r==="P"?`<span class="r r${r}" title="${RN[r]}">${r}</span>`:"";
const dot=(c,t)=>`<span><span class="r r${c}"></span>${t}</span>`;

function lineChart(host,P,{color="#5B2743",fmt=fn,label=""}={}){
 const W=720,H=290,l=46,r=14,t=18,b=30;
 const T=p=>Date.parse(p.d+"-01"),T0=T(P[0]),T1=T(P[P.length-1]);
 const top=Math.max(...P.map(p=>p.v)),st=top>50000?10000:top>5000?1000:top>500?100:top>50?10:1,mx=Math.ceil(top*1.12/st)*st||1;
 const X=x=>l+(x-T0)/(T1-T0)*(W-l-r),Y=v=>t+(1-v/mx)*(H-t-b);
 let g="";for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end">${v>=1000?Math.round(v/1000)+"k":Math.round(v)}</text>`}
 const y0=new Date(T0).getFullYear(),y1=new Date(T1).getFullYear();let ax="";
 for(let y=y0;y<=y1;y++){if((y-y0)%2)continue;const x=X(Date.parse(y+"-01-01"));if(x>=l)ax+=`<text x="${x}" y="${H-8}" text-anchor="middle">${y}</text>`}
 const pts=P.map(p=>[X(T(p)),Y(p.v)]);

   <div class="step"><div class="n">2</div><div><h3>Bel of app de recent gestopte mensen</h3><p>${recentIna.map(x=>esc(nice(x.n))).join(", ")} bestelden het laatst tussen oktober 2025 en april 2026.</p></div></div>

   <div class="step"><div class="n">4</div><div><h3>Houd je leiders warm</h3><p>Plan elke maand een kort moment met Carolien Appeltans en je andere leiders. Daar zit het volume en de toekomst van je team.</p></div></div>
   <div class="step"><div class="n">5</div><div><h3>Vier wie wel bestelt</h3><p>${act.length} mensen bestelden de laatste twee maanden. Een bedankje kost niets en houdt ze erbij.</p></div></div>
  </div>
  <h2>Berichten om te kopiëren</h2><p class="lead">Pas ze aan naar jouw stem.</p>
  <div class="card"><h3>Voor een rustige bestelling</h3><div class="msg" id="m1">Dag [naam], ik dacht aan je! Hoe gaat het met je? Ik zag dat het even geleden is sinds je laatste bestelling. Mis je iets, of heb je een vraag? Ik help je graag verder.</div><button class="btn" data-cp="m1">Kopieer</button></div>
  <div class="card"><h3>Voor iemand die nog niet bestelde</h3><div class="msg" id="m2">Dag [naam], leuk dat je erbij bent! Heb je al kunnen kiezen wat je wil proberen? Zal ik even met je meekijken naar je eerste bestelling? Dan lukt het zeker.</div><button class="btn" data-cp="m2">Kopieer</button></div>
  <div class="card"><h3>Voor een leider</h3><div class="msg" id="m3">Dag [naam], bedankt voor alles wat je opbouwt. Zullen we deze maand even bellen om te kijken waar ik je mee kan helpen?</div><button class="btn" data-cp="m3">Kopieer</button></div>
 </section>

 <section class="sec" id="s-cijfers">
  <h2>Over de cijfers</h2>
  <div class="card"><details open><summary>Waar komt dit vandaan?<span>▾</span></summary><p>Alles komt uit je eigen Virtual Office op youngliving.com: de downline-weergave per maand, de Leaders-lijst en het rapport Personally Enrolled. De leiders per maand komen uit het Leaders-rapport (rang per maand, januari 2013 tot oktober 2026) en de commissies uit Mijn Commissies. Alles is alleen gelezen, er is niets aangepast in het Virtual Office.</p></details>
  <details><summary>Wat zijn de commissiebedragen?<span>▾</span></summary><p>Bruto commissie per maand zoals Young Living die toont, vóór belasting en kosten. De maand van uitbetaling kan later vallen dan de maand waarvoor ze geldt.</p></details>
  <details><summary>Wat is OGV?<span>▾</span></summary><p>Organisatievolume: het totale volume van je hele organisatie in een maand.</p></details>
  <details><summary>Waarom per jaar, kwartaal en maand?<span>▾</span></summary><p>De eerste 10 jaar (2013–2022) zijn per jaar gemeten, 2023–2025 per kwartaal en 2026 per maand.</p></details>
  <details><summary>Waarom ontbreken er enrolments?<span>▾</span></summary><p>Young Living ruimt inactieve accounts op. Het aantal persoonlijk geënrolleerde accounts zakte van 97 (jan 2015) naar 65 (jan 2017) en 24 (jan 2019). Wie weg is, staat niet meer in de lijst. Vanaf 2018 ontbreken ook veel aanmelddatums.</p></details>
  <details><summary>Hoe is de status berekend?<span>▾</span></summary><p>Op de datum van de laatste bestelling, vergeleken met ${fd(D.asof)}.</p></details></div>
  <p class="note">Nadia Andries is onafhankelijk Young Living brand partner. Dit overzicht is geen inkomensbelofte of gezondheidsclaim.</p>
 </section>`;

 let mxEnd=()=>{};
 const go=n=>{document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===n));document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id==="s-"+n));
  try{history.replaceState(null,"","#"+n)}catch(_){}scrollTo({top:0});if(n==="leiders")mxEnd()};
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 document.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go)});
 const h=location.hash.slice(1);if(tabs.some(t=>t[0]===h))go(h);
 document.querySelectorAll(".kpi b").forEach(e=>countUp(e,+e.dataset.c));

 const draw=m=>{const P=m==="ogv"?M.map(x=>({d:x.d,v:x.ogv,r:x.r,extra:x.mem?fn(x.mem)+" mensen":""})):MM.map(x=>({d:x.d,v:x.mem,r:x.r,extra:"OGV "+fn(x.ogv)}));
  lineChart($("#ch"),P,{color:m==="ogv"?"#5B2743":"#b05a86",label:m==="ogv"?"OGV per periode":"Aantal mensen per periode"})};
 draw("ogv");document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));draw(b.dataset.m)});
 barChart($("#ch2"),D.snaps.filter(s=>s.d!=="2013-01").map(s=>({k:"'"+s.d.slice(2,4),v:s.lead,c:s.d===snapPk.d?"#e0b72e":"#5B2743"})));

 const draw2=()=>{const q=$("#q").value.trim().toLowerCase(),f=document.querySelector("#fs .on").dataset.f;
  const rows=L.filter(x=>(f==="all"||x.st[0]===f)&&nice(x.n).toLowerCase().includes(q));
  $("#pl").innerHTML=rows.map(x=>`<div class="person"><div class="av ${x.st[0]}">${esc(nice(x.n).charAt(0))}</div><div class="m"><b>${esc(nice(x.n))}</b><span>sinds ${x.sign?fd(x.sign):"–"} · ${x.last?"laatste bestelling "+ago(x.st[2]):"nog niet besteld"}${x.auto?" · Loyalty Rewards":""}</span></div><span class="pill p${x.st[0]}">${x.st[1]}</span></div>`).join("")||`<p class="note">Niemand gevonden.</p>`};
 draw2();$("#q").oninput=draw2;document.querySelectorAll("#fs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#fs button").forEach(x=>x.classList.toggle("on",x===b));draw2()});
 const ey={};Object.entries(D.enrol).forEach(([k,v])=>{ey[k.slice(0,4)]=(ey[k.slice(0,4)]||0)+v.length});
 const yrs=Object.keys(ey).sort();barChart($("#ey"),yrs.map(y=>({k:"'"+y.slice(2),v:ey[y]})),{color:"#7a3a5c"});
 $("#em").innerHTML=yrs.slice().reverse().map(y=>`<details><summary>${y}<span>${ey[y]} aangesloten</span></summary>${Object.keys(D.enrol).filter(k=>k.startsWith(y)).sort().map(k=>`<p><b>${MF[+k.slice(5)-1]}</b> (${D.enrol[k].length}): ${D.enrol[k].map(n=>esc(nice(n))).join(", ")}</p>`).join("")}</details>`).join("");


 // ---- commissie per maand ----
 const fe=v=>"€"+Math.round(v).toLocaleString("nl-BE");
 const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
 const mname=d=>cap(MF[+d.slice(5)-1])+" "+d.slice(0,4);
 const mons=Object.keys(D.lm).sort();
 const nadiaR=d=>{const r=(D.lm[d]||[]).find(x=>x[0]===0);return r?r[1]:undefined};
 const cms=Object.keys(D.comm).sort();
 lineChart($("#cmch"),cms.map(d=>({d,v:D.comm[d],r:nadiaR(d),extra:""})),{color:"#5B2743",fmt:fe,label:"Commissie per maand"});
 const cy={};cms.forEach(d=>{const y=d.slice(0,4);(cy[y]=cy[y]||[]).push(D.comm[d])});
 $("#cmt").innerHTML="<tr><th>Jaar</th><th>Mnd</th><th>Totaal</th><th>Per mnd</th><th>Hoogste</th></tr>"+Object.keys(cy).sort().reverse().map(y=>{const a=cy[y],t=a.reduce((x,z)=>x+z,0);return `<tr><td>${y}</td><td>${a.length}</td><td>${fe(t)}</td><td>${fe(t/a.length)}</td><td>${fe(Math.max(...a))}</td></tr>`}).join("");

 // ---- leiders per maand ----
 const RK={S:1,G:2,P:3},nm=i=>nice(D.ln[i]);
 const RL={S:"Silver",G:"Gold",P:"Platinum"};
 lineChart($("#lmch"),mons.map(d=>({d,v:D.lm[d].length,r:undefined,extra:""})),{color:"#7a3a5c",label:"Aantal leiders per maand"});
 $("#lms").innerHTML=mons.slice().reverse().map(d=>`<option value="${d}">${mname(d)}</option>`).join("");
 const lmShow=d=>{const k=mons.indexOf(d),cur=D.lm[d]||[],prv=k>0?new Map(D.lm[mons[k-1]].map(x=>[x[0],x[1]])):null;
  const n=r=>cur.filter(x=>x[1]===r).length,cm=D.comm[d];
  const rows=cur.slice().sort((a,b)=>RK[b[1]]-RK[a[1]]||a[2]-b[2]);
  const gone=prv?[...prv.keys()].filter(i=>!cur.some(x=>x[0]===i)):[];
  $("#lmo").innerHTML=`<div class="sum"><b>${cur.length}</b> ${cur.length===1?"leider":"leiders"} · ${n("S")} Silver · ${n("G")} Gold · ${n("P")} Platinum${cm?` · commissie <b>${fe(cm)}</b>`:""}</div>`+
   (rows.length?rows.map(x=>{const pr=prv&&prv.get(x[0]);const tag=!prv?"":pr==null?` · <em class="nw">nieuw in de lijst</em>`:pr===x[1]?"":RK[x[1]]>RK[pr]?` · <em class="up">▲ was ${RL[pr]}</em>`:` · <em class="dn">▼ was ${RL[pr]}</em>`;
    return `<div class="person">${rk(x[1])}<div class="m"><b>${esc(nm(x[0]))}</b><span>${x[0]===0?"Nadia zelf":"niveau "+x[2]+" onder jou"}${tag}</span></div></div>`}).join(""):`<p class="note">Geen leiders in de lijst voor deze maand.</p>`)+
   (gone.length?`<p class="note">Niet meer in de lijst: ${gone.map(i=>esc(nm(i))).join(", ")}.</p>`:"")};
 $("#lms").onchange=e=>lmShow(e.target.value);lmShow(mons[mons.length-1]);

 // ---- rang per maand (raster) ----
 const first={},cell={};mons.forEach(d=>{cell[d]=new Map(D.lm[d].map(x=>[x[0],x[1]]));D.lm[d].forEach(x=>{if(first[x[0]]==null)first[x[0]]=d})});
 const ord=Object.keys(first).map(Number).sort((a,b)=>first[a].localeCompare(first[b])||a-b);
 $("#lmx").innerHTML=`<div class="mxr mxh"><span class="mxn"></span><span class="mxc">${mons.map(d=>d.slice(5)==="01"?`<u data-y="${d.slice(0,4)}"></u>`:"<u></u>").join("")}</span></div>`+
  ord.map(i=>`<div class="mxr"><span class="mxn" title="${esc(nm(i))}">${esc(nm(i))}</span><span class="mxc">${mons.map(d=>{const r=cell[d].get(i);return `<i class="${r||""}" title="${esc(nm(i))} · ${fd(d)}${r?" · "+RL[r]:""}"></i>`}).join("")}</span></div>`).join("");
 mxEnd=()=>{const x=$("#lmx");if(x)x.scrollLeft=x.scrollWidth};if($("#s-leiders").classList.contains("on"))mxEnd();

 // ---- rangwissels ----
 const ev={};mons.forEach((d,k)=>{if(!k){ev[d]=[];return}const cur=cell[d],prv=cell[mons[k-1]],e=[];
  cur.forEach((r,i)=>{if(!prv.has(i))e.push({t:"new",i,r});else if(prv.get(i)!==r)e.push({t:RK[r]>RK[prv.get(i)]?"up":"down",i,r,f:prv.get(i)})});
  prv.forEach((r,i)=>{if(!cur.has(i))e.push({t:"out",i,r})});
  e.sort((a,b)=>(a.i===0?0:1)-(b.i===0?0:1)||a.i-b.i);ev[d]=e});
 const ryrs=[...new Set(mons.map(d=>d.slice(0,4)))].reverse();
 $("#rws").innerHTML=ryrs.map(y=>`<option>${y}</option>`).join("");
 const evTxt=e=>{const b=`${rk(e.t==="out"?e.r:e.r)}`,N=`<b>${esc(nm(e.i))}</b>`;
  return e.t==="new"?`<div>${b}${N} nieuw in de lijst als ${RL[e.r]}</div>`:e.t==="up"?`<div>${b}${N} <span class="up">▲</span> ${RL[e.f]} → ${RL[e.r]}</div>`:e.t==="down"?`<div>${b}${N} <span class="dn">▼</span> ${RL[e.f]} → ${RL[e.r]}</div>`:`<div>${b}${N} niet meer in de lijst (was ${RL[e.r]})</div>`};
 const rwShow=y=>{const ms=mons.filter(d=>d.startsWith(y)),all=ms.flatMap(d=>ev[d]),c=t=>all.filter(e=>e.t===t).length;
  $("#rwsum").innerHTML=`${y}: <b>${c("up")}</b> keer hoger · <b>${c("down")}</b> keer lager · <b>${c("new")}</b> nieuw in de lijst · <b>${c("out")}</b> eruit`;
  const body=ms.slice().reverse().filter(d=>ev[d].length).map(d=>`<div class="rwb"><div class="rwd">${MN[+d.slice(5)-1]} ${d.slice(0,4)}</div><div class="rwl">${ev[d].map(evTxt).join("")}</div></div>`).join("");
  $("#rwo").innerHTML=body||`<p class="note">Geen wissels in ${y}.</p>`};
 $("#rws").onchange=e=>rwShow(e.target.value);rwShow(ryrs[0]);

 document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{const el=$("#"+b.dataset.cp);try{await navigator.clipboard.writeText(el.textContent);b.textContent="Gekopieerd ✓"}catch(_){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selecteer en kopieer"}setTimeout(()=>b.textContent="Kopieer",1800)});
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
