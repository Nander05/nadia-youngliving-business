<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nadia Andries · Team</title>
<meta name="theme-color" content="#5B2743">
<meta name="robots" content="noindex,nofollow">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Outfit;font-weight:300;src:url(fonts/outfit-latin-300-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Outfit;font-weight:400;src:url(fonts/outfit-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Manrope;font-weight:400;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Manrope;font-weight:600;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2");font-display:swap}
:root{--bg:#FAF8F5;--card:#fff;--mist:#F1EAEE;--aub:#5B2743;--aub2:#7a3a5c;--ink:#191919;--mute:#6f6168;--line:#e6dde2;--red:#DA0821;--ok:#3f7d5a;--okbg:#e3f0e8;--mid:#b07d2b;--midbg:#f6ecd6;--badbg:#f1e4e7;--S:#d98b3a;--G:#e0b72e;--P:#4b8f5f;--shadow:0 1px 2px rgba(91,39,67,.06),0 8px 24px rgba(91,39,67,.07);--hero:linear-gradient(135deg,#4a1d36 0%,#5B2743 55%,#7a3a5c 100%)}
@media (prefers-color-scheme:dark){:root{--bg:#161014;--card:#221a20;--mist:#2c2128;--aub:#e9c9dc;--aub2:#d9a8c4;--ink:#f1eaee;--mute:#a8979f;--line:#3a2d35;--okbg:#1f3a2b;--midbg:#3b3018;--badbg:#3d1f26;--shadow:none;--hero:linear-gradient(135deg,#2a1020 0%,#3d1a2f 55%,#5B2743 100%)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Manrope,system-ui,sans-serif;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto}
.brand{font:600 12px Manrope;letter-spacing:.26em;text-transform:uppercase}
h1{font:300 clamp(30px,7vw,44px)/1.1 Outfit,sans-serif;margin:8px 0 6px;text-wrap:balance}
h2{font:400 24px/1.2 Outfit;color:var(--aub);margin:34px 0 4px;text-wrap:balance}
h3{font:600 14px Manrope;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 14px;max-width:62ch}
.hero{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 26px;background:var(--hero);color:#F1EAEE;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(241,234,238,.16),transparent 70%)}
.hero>*{max-width:820px;margin-left:auto;margin-right:auto;position:relative;z-index:1}
.hero .sub{color:#d8c3cf;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:22px}
.kpi{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px}
.kpi b{display:block;font:300 34px/1 Outfit}
.kpi span{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#d8c3cf;margin-top:7px}
.kpi small{display:block;font-size:12px;margin-top:4px;color:#f3c7d6}
.up{color:#9be0b4!important}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{font:600 13px Manrope;border:1px solid var(--line);background:var(--card);color:var(--aub);padding:9px 15px;border-radius:999px;white-space:nowrap;cursor:pointer;flex:none}
nav button.on{background:var(--aub);color:var(--bg);border-color:var(--aub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;box-shadow:var(--shadow);margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font:300 38px/1 Outfit;color:var(--aub)}
.l{font-size:11px;color:var(--mute);margin-top:7px;text-transform:uppercase;letter-spacing:.09em}
.insight{display:flex;gap:14px;align-items:flex-start}
.insight .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--mist);color:var(--aub);display:grid;place-items:center;font:400 18px Outfit}
.insight p{margin:2px 0 0;color:var(--mute);font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11px Manrope;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.c,th.c{text-align:center}
.pill{display:inline-block;font:600 11px Manrope;padding:3px 10px;border-radius:999px;flex:none}
.pa{background:var(--okbg);color:var(--ok)}.ps{background:var(--midbg);color:var(--mid)}.pi{background:var(--badbg);color:var(--red)}
.r{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:600 12px Manrope;color:#fff}
.rS{background:var(--S)}.rG{background:var(--G)}.rP{background:var(--P)}
.note{font-size:12.5px;color:var(--mute);margin:10px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg);flex-wrap:wrap}
.seg button{font:600 12.5px Manrope;border:0;background:none;color:var(--mute);padding:7px 13px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--aub);color:var(--bg)}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
svg text{font:11px Manrope;fill:var(--mute)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:3}
.tip b{font:600 13px Manrope}
.strip{display:flex;gap:2px;margin-top:10px}
.strip i{flex:1;height:30px;border-radius:4px;background:var(--line)}
.strip-l{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:5px}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:10px;align-items:center}
.leg .r{width:14px;height:14px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.person{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.person:last-child{border:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:400 16px Outfit;color:#fff}
.av.a{background:var(--ok)}.av.s{background:var(--mid)}.av.i{background:#a9919d}
.person .m{flex:1;min-width:0}
.person .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .m span{font-size:12.5px;color:var(--mute)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input{flex:1;min-width:140px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:400 14px Manrope}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.lc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.lc .card{margin-top:0}
.lc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lc .nm{font:400 19px/1.2 Outfit;color:var(--aub)}
.lc dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.lc dt{color:var(--mute)}.lc dd{margin:0;text-align:right}
details{border-bottom:1px solid var(--line);padding:10px 0}
details:last-child{border:0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary span{color:var(--mute);font-weight:400}
details p{margin:8px 0 0;font-size:13.5px;color:var(--mute)}
.step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--aub);color:var(--bg);display:grid;place-items:center;font:600 13px Manrope}
.step p{margin:2px 0 0;color:var(--mute);font-size:14px}
.msg{background:var(--mist);border-radius:14px;padding:14px;font-size:14px;margin-top:10px}
.btn{font:600 13px Manrope;border:0;border-radius:999px;background:var(--aub);color:var(--bg);padding:9px 16px;cursor:pointer;margin-top:10px}
#lock{max-width:380px;margin:18vh auto 0;text-align:center}
#lock .brand,#lock h1{color:var(--aub)}
#lock input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:400 16px Manrope;margin:16px 0 10px;background:var(--card);color:var(--ink)}
#lock button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--aub);color:var(--bg);font:600 15px Manrope;cursor:pointer}
#err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
footer{margin-top:36px;font-size:12px;color:var(--mute)}
.sec{display:none}.sec.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sec.on{animation:none}html{scroll-behavior:auto}}

const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.s),iterations:BLOB.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
 const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.i)},key,b64(BLOB.c));return JSON.parse(new TextDecoder().decode(p))}
$("#f").onsubmit=async e=>{e.preventDefault();const pw=$("#pw").value.trim();$("#err").textContent="";
 try{const D=await dec(pw);try{if($("#rem").checked)localStorage.setItem("na-pw",pw)}catch(_){}show(D)}catch(_){$("#err").textContent="Dat wachtwoord klopt niet."}};
(async()=>{try{const pw=localStorage.getItem("na-pw");if(pw){show(await dec(pw))}}catch(_){try{localStorage.removeItem("na-pw")}catch(__){}}})();

const MN=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MF=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const fd=s=>{if(!s)return"–";const[y,m,d]=s.split("-");return d?`${+d} ${MN[+m-1]} ${y}`:`${MN[+m-1]} ${y}`};
const fn=n=>Math.round(n).toLocaleString("nl-BE");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RN={S:"Silver",G:"Gold",P:"Platinum"};
const RC={S:"#d98b3a",G:"#e0b72e",P:"#4b8f5f"};
const KEEP=new Set(["DYOB","BVBA","BV","CBC","VOF"]);
const LOW=new Set(["van","de","der","den","ten","te","von","du"]);
function nice(n){let p=n.split(", ");if(p.length>1)p=[p.slice(1).join(" "),p[0]];const s=p.join(" ");
 return s.split(" ").map((w,i)=>KEEP.has(w.toUpperCase())?w.toUpperCase():(i&&LOW.has(w.toLowerCase())?w.toLowerCase():w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())).join(" ")}
const nd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function ago(d){if(d<1)return"vandaag";if(d<14)return d+" dagen geleden";if(d<75)return Math.round(d/7)+" weken geleden";if(d<700)return Math.round(d/30.4)+" mnd geleden";return(d/365).toFixed(1).replace(".",",")+" jaar geleden"}
function status(x,asof){if(!x.last)return["i","Nog niet besteld",9999];const d=nd(x.last,asof);return d<=62?["a","Actief",d]:d<=200?["s","Rustig",d]:["i","Inactief",d]}
const rk=r=>r==="G"||r==="S"||r==="P"?`<span class="r r${r}" title="${RN[r]}">${r}</span>`:"";
const dot=(c,t)=>`<span><span class="r r${c}"></span>${t}</span>`;

function lineChart(host,P,{color="#5B2743",fmt=fn,label=""}={}){
 const W=720,H=290,l=46,r=14,t=18,b=30;
 const T=p=>Date.parse(p.d+"-01"),T0=T(P[0]),T1=T(P[P.length-1]);
 const top=Math.max(...P.map(p=>p.v)),st=top>5000?10000:100,mx=Math.ceil(top*1.12/st)*st||1;
 const X=x=>l+(x-T0)/(T1-T0)*(W-l-r),Y=v=>t+(1-v/mx)*(H-t-b);
 let g="";for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end">${v>=1000?Math.round(v/1000)+"k":Math.round(v)}</text>`}
 const y0=new Date(T0).getFullYear(),y1=new Date(T1).getFullYear();let ax="";
 for(let y=y0;y<=y1;y++){if((y-y0)%2)continue;const x=X(Date.parse(y+"-01-01"));if(x>=l)ax+=`<text x="${x}" y="${H-8}" text-anchor="middle">${y}</text>`}
 const pts=P.map(p=>[X(T(p)),Y(p.v)]);
 const line=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1)).join("");
 const area=line+`L${pts[pts.length-1][0]},${H-b}L${pts[0][0]},${H-b}Z`;
 const pk=P.reduce((a,b)=>b.v>a.v?b:a);
 const id="g"+Math.random().toString(36).slice(2,7);
 host.innerHTML=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}${ax}<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round"/>${P.map((p,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${p.d===pk.d?5.5:3.2}" fill="${RC[p.r]||color}" stroke="var(--card)" stroke-width="1.5"/>`).join("")}<line class="cx" y1="${t}" y2="${H-b}" stroke="${color}" stroke-dasharray="3 3" opacity="0"/><text x="${Math.min(X(T(pk)),W-60)}" y="${Y(pk.v)-11}" text-anchor="middle" style="fill:${color};font-weight:600">piek ${fmt(pk.v)}</text></svg><div class="tip"></div></div>`;
 const c=host.querySelector(".chart"),svg=c.querySelector("svg"),tip=c.querySelector(".tip"),cx=c.querySelector(".cx");
 const mv=e=>{const rc=svg.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width*W;let bi=0,bd=1e9;pts.forEach((q,i)=>{const d=Math.abs(q[0]-x);if(d<bd){bd=d;bi=i}});
  const p=P[bi];cx.setAttribute("x1",pts[bi][0]);cx.setAttribute("x2",pts[bi][0]);cx.setAttribute("opacity",.7);
  tip.innerHTML=`<b>${fmt(p.v)}</b><br>${fd(p.d)}${RN[p.r]?"<br>Nadia: "+RN[p.r]:""}${p.extra?"<br>"+p.extra:""}`;
  const lx=Math.min(Math.max(pts[bi][0]/W*rc.width,60),rc.width-60);tip.style.left=lx+"px";tip.style.top=(pts[bi][1]/H*rc.height-8)+"px";tip.style.opacity=1};
 c.addEventListener("pointermove",mv);c.addEventListener("pointerdown",mv);
 c.addEventListener("pointerleave",()=>{tip.style.opacity=0;cx.setAttribute("opacity",0)});
}
function barChart(host,items,{color="#5B2743",h=170}={}){
 const W=720,l=10,t=22,b=24,mx=Math.max(...items.map(i=>i.v),1),n=items.length,bw=(W-l-8)/n;
 host.innerHTML=`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">${items.map((it,i)=>{const bh=(it.v/mx)*(h-t-b),x=l+i*bw;return `<rect x="${x+bw*.15}" y="${h-b-bh}" width="${bw*.7}" height="${bh}" rx="4" fill="${it.c||color}" opacity="${it.v?1:.25}"/><text x="${x+bw/2}" y="${h-b-bh-5}" text-anchor="middle" style="font-weight:600">${it.v||""}</text><text x="${x+bw/2}" y="${h-7}" text-anchor="middle">${it.k}</text>`}).join("")}</svg>`}
function countUp(el,to,ms=900){if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fn(to);return}
 const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=fn(to*e);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

function show(D){$("#lock").hidden=true;$("#app").hidden=false;$("#foot").hidden=false;
 const M=D.months,last=M[M.length-1],pkO=M.reduce((a,b)=>b.ogv>a.ogv?b:a);
 const MM=M.filter(m=>m.mem),pkM=MM.reduce((a,b)=>b.mem>a.mem?b:a),curM=MM[MM.length-1];
 const L=D.l1.map(x=>({...x,st:status(x,D.asof)})).sort((a,b)=>a.st[2]-b.st[2]);
 const act=L.filter(x=>x.st[0]=="a"),rus=L.filter(x=>x.st[0]=="s"),ina=L.filter(x=>x.st[0]=="i");
 const lead=D.leaders.filter(x=>x.level>0),snapNow=D.snaps[D.snaps.length-1],snapPk=D.snaps.reduce((a,b)=>b.lead>a.lead?b:a);
 const dOgv=(last.ogv/pkO.ogv-1)*100,dMem=(curM.mem/pkM.mem-1)*100;
 const goldN=M.filter(m=>m.r==="G").length,silvN=M.filter(m=>m.r==="S").length,starN=M.filter(m=>m.r==="star").length;
 const nov=D.nov.ogv,dy=L.slice().sort((a,b)=>b.ogv-a.ogv)[0],dyShare=dy.ogv/nov*100;
 const tabs=[["overzicht","Overzicht"],["groei","Groei"],["leiders","Leiders"],["team","Eigen team"],["actie","Actieplan"],["cijfers","Over de cijfers"]];
 const recentIna=ina.filter(x=>x.last&&x.st[2]<=420);
 $("#app").innerHTML=`<header class="hero"><div class="brand">Nadia Andries</div><h1>Jouw team in cijfers</h1><p class="sub">Stand van ${fd(D.asof)} · ${fn(D.nov.members)} mensen in je organisatie · Silver, ooit Gold</p>
 <div class="kpis">
  <div class="kpi"><b data-c="${last.ogv}">0</b><span>OGV ${fd(last.d)}</span><small>${dOgv<0?"▼":"▲"} ${Math.abs(Math.round(dOgv))}% t.o.v. piek</small></div>
  <div class="kpi"><b data-c="${D.nov.members}">0</b><span>Mensen in je team</span><small>${Math.abs(Math.round(dMem))}% minder dan piek</small></div>
  <div class="kpi"><b data-c="${snapNow.lead}">0</b><span>Leiders (Silver+)</span><small>piek was ${snapPk.lead}</small></div>
  <div class="kpi"><b data-c="${act.length}">0</b><span>Eigen enrolments actief</span><small class="up">van ${L.length} op niveau 1</small></div>
 </div></header>
 <nav>${tabs.map((t,i)=>`<button data-t="${t[0]}" class="${i?"":"on"}">${t[1]}</button>`).join("")}</nav>

 <section class="sec on" id="s-overzicht">
  <h2>Wat er echt aan de hand is</h2><p class="lead">Vier dingen die opvallen als je alle jaren naast elkaar legt.</p>
  <div class="card"><div class="insight"><div class="ic">1</div><div><h3>Ver boven waar je begon, onder je piek</h3><p>Je organisatie bereikte ${fn(pkO.ogv)} OGV in ${fd(pkO.d)}. Nu is dat ${fn(last.ogv)}: ${Math.abs(Math.round(dOgv))}% lager. In ${fd(M[0].d)} stond je op ${fn(M[0].ogv)}.</p></div></div></div>
  <div class="card"><div class="insight"><div class="ic">2</div><div><h3>Minder mensen, en iets minder volume per persoon</h3><p>Je team telde in ${fd(pkM.d)} ${fn(pkM.mem)} mensen, nu ${fn(curM.mem)} (${Math.round(dMem)}%). Het volume per persoon ging van ${fn(pkO.ogv/pkM.mem)} naar ${fn(last.ogv/curM.mem)}. Herstel zit dus in zowel meer actieve mensen als wat meer bestellen per persoon.</p></div></div></div>
  <div class="card"><div class="insight"><div class="ic">3</div><div><h3>${esc(nice(dy.n))} draagt je team</h3><p>Deze maand komt ${Math.round(dyShare)}% van het volume van je eerste lijn via ${esc(nice(dy.n))} (${fn(dy.ogv)} van ${fn(nov)} OGV tot nu toe). Die lijn koesteren is het belangrijkste dat je doet.</p></div></div></div>
  <div class="card"><div class="insight"><div class="ic">4</div><div><h3>${rus.length+ina.length} van je ${L.length} eigen mensen bestellen nu niet</h3><p>${act.length} zijn actief. ${rus.length} zijn net stil geworden: die zijn het makkelijkst terug te halen. Zie het <a href="#actie" data-go="actie" style="color:var(--aub);font-weight:600">Actieplan</a>.</p></div></div></div>
  <h2>Rangen door de jaren</h2><div class="card"><h3>Nadia's rang per meting</h3>
   <div class="strip">${M.map(m=>`<i title="${fd(m.d)}: ${RN[m.r]||(m.r==="star"?"Star":m.r)}" style="background:${RC[m.r]||(m.r==="star"?"#c9a3b8":"var(--line)")}"></i>`).join("")}</div>
   <div class="strip-l"><span>${fd(M[0].d)}</span><span>${fd(M[Math.floor(M.length/2)].d)}</span><span>${fd(last.d)}</span></div>
   <div class="leg">${dot("S",`Silver (${silvN}×)`)}${dot("G",`Gold (${goldN}×)`)}<span>Star vóór Silver: ${starN}×</span></div>
   <p class="note">Gemeten in ${M.length} periodes.</p></div>
 </section>

 <section class="sec" id="s-groei">
  <h2>Groei door de jaren</h2><p class="lead">Tik of sleep over de grafiek om elke meting te zien. De kleur van het bolletje toont Nadia's rang op dat moment.</p>
  <div class="card"><div class="seg" id="seg"><button class="on" data-m="ogv">OGV</button><button data-m="mem">Aantal mensen</button></div><div id="ch" style="margin-top:12px"></div>
   <p class="note">Per jaar tot en met 2022, per kwartaal 2023–2025 en per maand in 2026. Oudere ledentellingen zijn minder betrouwbaar omdat Young Living inactieve accounts opruimt.</p></div>
  <h2>Leiders in je organisatie</h2><div class="card"><div id="ch2"></div><p class="note">Aantal mensen met Silver of hoger op elke momentopname. Geel = piek.</p></div>
  <h2>Cijfers per periode</h2><div class="card"><div class="scroll"><table><tr><th>Periode</th><th class="c">Rang</th><th>OGV</th><th>Mensen</th></tr>${[...M].reverse().map(m=>`<tr><td>${fd(m.d)}</td><td class="c">${rk(m.r)||`<span class="note">${m.r==="star"?"★":m.r}</span>`}</td><td>${fn(m.ogv)}</td><td>${m.mem?fn(m.mem):"–"}</td></tr>`).join("")}</table></div></div>
 </section>

 <section class="sec" id="s-leiders">
  <h2>Je leiders nu</h2><p class="lead">Wie in oktober 2026 Silver of hoger is in je organisatie, met het niveau onder jou.</p>
  <div class="lc">${lead.map(x=>`<div class="card"><div class="top"><div class="nm">${esc(x.name)}</div>${rk(x.rank_now[0]==="G"?"G":x.rank_now[0]==="P"?"P":"S")}</div>
   <dl><dt>Nu</dt><dd>${x.rank_now}</dd><dt>Hoogste rang</dt><dd>${x.rank_high}</dd><dt>Niveau onder jou</dt><dd>${x.level}</dd><dt>Aangesloten</dt><dd>${fd(x.signup)}</dd><dt>Sponsor</dt><dd>${esc(x.sponsor)}</dd></dl></div>`).join("")}</div>
  <h2>Wie was wanneer leider?</h2><div class="card"><div class="scroll"><table><tr><th>Naam</th>${D.dates.map(d=>`<th class="c">${fd(d)}</th>`).join("")}</tr>${Object.entries(D.ranks).map(([n,v])=>`<tr><td>${esc(n)}</td>${v.map(c=>`<td class="c">${rk(c)||"·"}</td>`).join("")}</tr>`).join("")}</table></div>
   <div class="leg">${dot("S","Silver")}${dot("G","Gold")}${dot("P","Platinum")}<span>· niet in de Leaders-lijst</span></div>
   <p class="note">Momentopnames; de exacte maand van een rangwissel kan tot een jaar ernaast zitten.</p></div>
 </section>

 <section class="sec" id="s-team">
  <h2>Wie jij persoonlijk enrolde</h2>
  <div class="card"><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px"><div><div class="big">${act.length}</div><div class="l">Actief</div></div><div><div class="big">${rus.length}</div><div class="l">Rustig</div></div><div><div class="big">${ina.length}</div><div class="l">Inactief</div></div></div>
   <div class="bar" style="margin-top:16px"><i style="width:${act.length/L.length*100}%;background:var(--ok)"></i><i style="width:${rus.length/L.length*100}%;background:var(--mid)"></i><i style="width:${ina.length/L.length*100}%;background:#a9919d"></i></div>
   <p class="note">Actief: bestelling in de laatste 2 maanden · Rustig: 2–6 maanden · Inactief: langer of nooit.</p></div>
  <div class="card"><div class="tools"><input id="q" type="search" placeholder="Zoek een naam"><div class="seg" id="fs"><button class="on" data-f="all">Alle ${L.length}</button><button data-f="a">Actief</button><button data-f="s">Rustig</button><button data-f="i">Inactief</button></div></div><div id="pl"></div></div>
  <h2>Per maand geënrolleerd</h2><p class="lead">Wie je persoonlijk aansloot, per jaar en maand.</p>
  <div class="card"><div id="ey"></div><div id="em" style="margin-top:8px"></div>
   <p class="note">Minimumcijfers: alleen accounts die nog in het Virtual Office staan of in een momentopname (jan 2013, 2015, 2017) zaten. Accounts die Young Living sindsdien opruimde ontbreken. Vanaf 2018 ontbreken veel aanmelddatums.</p></div>
 </section>

 <section class="sec" id="s-actie">
  <h2>Jouw actieplan</h2><p class="lead">Op volgorde van wat het meeste oplevert voor de minste moeite.</p>
  <div class="card">
   <div class="step"><div class="n">1</div><div><h3>Reactiveer de ${rus.length} rustige mensen</h3><p>${rus.map(x=>esc(nice(x.n))+" ("+ago(x.st[2]).replace(" geleden","")+")").join(", ")}. Hun laatste bestelling is nog vers: één persoonlijk berichtje is genoeg.</p></div></div>
   <div class="step"><div class="n">2</div><div><h3>Bel of app de recent gestopte mensen</h3><p>${recentIna.map(x=>esc(nice(x.n))).join(", ")} bestelden het laatst tussen oktober 2025 en april 2026.</p></div></div>
   <div class="step"><div class="n">3</div><div><h3>Begeleid de nieuwe aanmelders</h3><p>${ina.filter(x=>!x.last).map(x=>esc(nice(x.n))).join(" en ")} sloten zich aan maar bestelden nog niet. Een warm welkom en hulp bij de eerste bestelling doet veel.</p></div></div>
   <div class="step"><div class="n">4</div><div><h3>Houd je leiders warm</h3><p>Plan elke maand een kort moment met Carolien Appeltans en je andere leiders. Daar zit het volume en de toekomst van je team.</p></div></div>
   <div class="step"><div class="n">5</div><div><h3>Vier wie wel bestelt</h3><p>${act.length} mensen bestelden de laatste twee maanden. Een bedankje kost niets en houdt ze erbij.</p></div></div>
  </div>
  <h2>Berichten om te kopiëren</h2><p class="lead">Pas ze aan naar jouw stem.</p>
  <div class="card"><h3>Voor een rustige bestelling</h3><div class="msg" id="m1">Dag [naam], ik dacht aan je! Hoe gaat het met je? Ik zag dat het even geleden is sinds je laatste bestelling. Mis je iets, of heb je een vraag? Ik help je graag verder.</div><button class="btn" data-cp="m1">Kopieer</button></div>
  <div class="card"><h3>Voor iemand die nog niet bestelde</h3><div class="msg" id="m2">Dag [naam], leuk dat je erbij bent! Heb je al kunnen kiezen wat je wil proberen? Zal ik even met je meekijken naar je eerste bestelling? Dan lukt het zeker.</div><button class="btn" data-cp="m2">Kopieer</button></div>
  <div class="card"><h3>Voor een leider</h3><div class="msg" id="m3">Dag [naam], bedankt voor alles wat je opbouwt. Zullen we deze maand even bellen om te kijken waar ik je mee kan helpen?</div><button class="btn" data-cp="m3">Kopieer</button></div>
 </section>

 <section class="sec" id="s-cijfers">
  <h2>Over de cijfers</h2>
  <div class="card"><details open><summary>Waar komt dit vandaan?<span>▾</span></summary><p>Alles komt uit je eigen Virtual Office op youngliving.com: de downline-weergave per maand, de Leaders-lijst en het rapport Personally Enrolled.</p></details>
  <details><summary>Wat is OGV?<span>▾</span></summary><p>Organisatievolume: het totale volume van je hele organisatie in een maand.</p></details>
  <details><summary>Waarom per jaar, kwartaal en maand?<span>▾</span></summary><p>De eerste 10 jaar (2013–2022) zijn per jaar gemeten, 2023–2025 per kwartaal en 2026 per maand.</p></details>
  <details><summary>Waarom ontbreken er enrolments?<span>▾</span></summary><p>Young Living ruimt inactieve accounts op. Het aantal persoonlijk geënrolleerde accounts zakte van 97 (jan 2015) naar 65 (jan 2017) en 24 (jan 2019). Wie weg is, staat niet meer in de lijst. Vanaf 2018 ontbreken ook veel aanmelddatums.</p></details>
  <details><summary>Hoe is de status berekend?<span>▾</span></summary><p>Op de datum van de laatste bestelling, vergeleken met ${fd(D.asof)}.</p></details></div>
  <p class="note">Nadia Andries is onafhankelijk Young Living brand partner. Dit overzicht is geen inkomensbelofte of gezondheidsclaim.</p>
 </section>`;

 const go=n=>{document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===n));document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id==="s-"+n));
  try{history.replaceState(null,"","#"+n)}catch(_){}scrollTo({top:0})};
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 document.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go)});
 const h=location.hash.slice(1);if(tabs.some(t=>t[0]===h))go(h);
 document.querySelectorAll(".kpi b").forEach(e=>countUp(e,+e.dataset.c));

 const draw=m=>{const P=m==="ogv"?M.map(x=>({d:x.d,v:x.ogv,r:x.r,extra:x.mem?fn(x.mem)+" mensen":""})):MM.map(x=>({d:x.d,v:x.mem,r:x.r,extra:"OGV "+fn(x.ogv)}));
  lineChart($("#ch"),P,{color:m==="ogv"?"#5B2743":"#b05a86",label:m==="ogv"?"OGV per periode":"Aantal mensen per periode"})};
 draw("ogv");document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));draw(b.dataset.m)});
 barChart($("#ch2"),D.snaps.filter(s=>s.d!=="2013-01").map(s=>({k:"'"+s.d.slice(2,4),v:s.lead,c:s.d===snapPk.d?"#e0b72e":"#5B2743"})));

 const draw2=()=>{const q=$("#q").value.trim().toLowerCase(),f=document.querySelector("#fs .on").dataset.f;
  const rows=L.filter(x=>(f==="all"||x.st[0]===f)&&nice(x.n).toLowerCase().includes(q));
  $("#pl").innerHTML=rows.map(x=>`<div class="person"><div class="av ${x.st[0]}">${esc(nice(x.n).charAt(0))}</div><div class="m"><b>${esc(nice(x.n))}</b><span>sinds ${x.sign?fd(x.sign):"–"} · ${x.last?"laatste bestelling "+ago(x.st[2]):"nog niet besteld"}${x.auto?" · Loyalty Rewards":""}</span></div><span class="pill p${x.st[0]}">${x.st[1]}</span></div>`).join("")||`<p class="note">Niemand gevonden.</p>`};
 draw2();$("#q").oninput=draw2;document.querySelectorAll("#fs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#fs button").forEach(x=>x.classList.toggle("on",x===b));draw2()});
 const ey={};Object.entries(D.enrol).forEach(([k,v])=>{ey[k.slice(0,4)]=(ey[k.slice(0,4)]||0)+v.length});
 const yrs=Object.keys(ey).sort();barChart($("#ey"),yrs.map(y=>({k:"'"+y.slice(2),v:ey[y]})),{color:"#7a3a5c"});
 $("#em").innerHTML=yrs.slice().reverse().map(y=>`<details><summary>${y}<span>${ey[y]} aangesloten</span></summary>${Object.keys(D.enrol).filter(k=>k.startsWith(y)).sort().map(k=>`<p><b>${MF[+k.slice(5)-1]}</b> (${D.enrol[k].length}): ${D.enrol[k].map(n=>esc(nice(n))).join(", ")}</p>`).join("")}</details>`).join("");

 document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{const el=$("#"+b.dataset.cp);try{await navigator.clipboard.writeText(el.textContent);b.textContent="Gekopieerd ✓"}catch(_){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selecteer en kopieer"}setTimeout(()=>b.textContent="Kopieer",1800)});
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
